<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaming Nexus | Submission Confirmed</title>
  <link rel="stylesheet" href="styles/normalize.css">
  <link rel="stylesheet" href="styles/small.css">
  <link rel="stylesheet" href="styles/larger.css">
  <script src="scripts/homepage.js" type="module"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const displayField = document.getElementById("submission-counter-badge");
      const dataOutputField = document.getElementById("submitted-parameters-dump");
      const urlParameters = new URLSearchParams(window.location.search);
      
      let submissionCount = parseInt(localStorage.getItem("nexusProfilesSubmittedCount"), 10) || 0;
      submissionCount += 1;
      localStorage.setItem("nexusProfilesSubmittedCount", submissionCount.toString());

      if (displayField) {
        displayField.textContent = `Nexus Profiles Tracked in LocalStorage: ${submissionCount} Total`;
      }

      if (dataOutputField && urlParameters.has("targetGenre")) {
        const genre = urlParameters.get("targetGenre").toUpperCase();
        const frequency = urlParameters.get("playFrequency").toUpperCase();
        const date = urlParameters.get("installationDate");
        const tag = urlParameters.get("gamerTag") || "Anonymous Player";
        
        dataOutputField.innerHTML = `
          <ul class="params-summary-list">
            <li><strong>Registered Gamer Tag:</strong> ${tag}</li>
            <li><strong>Selected Arena Target:</strong> ${genre}</li>
            <li><strong>Play Duration Status:</strong> ${frequency}</li>
            <li><strong>Target Calibration Date:</strong> ${date}</li>
          </ul>
        `;
      }
    });
  </script>
</head>
<body>

  <header class="global-header">
    
      <span class="brand-title">Gaming Nexus</span>
    </div>
  </header>

  <main class="form-main-shell" style="max-width:600px; margin:0 auto;">
    <div class="form-workspace-card thanks-alignment-box" style="text-align:center; padding:2.5rem 1.5rem;">
      <div id="submission-counter-badge" class="user-state-banner" style="display:block; background-color:var(--petroleum-blue);">Updating global metrics cache...</div>
      <h2 style="color:var(--petroleum-blue); font-size:1.8rem; margin-top:0;">Profile Synced Successfully!</h2>
      <p style="font-size:1.05rem; color:var(--text-dark); line-height:1.5; margin-bottom:2rem;">Your gameplay preferences have been saved cleanly inside your browser storage database.</p>

      <div style="background:#ffffff; padding:1.25rem; border-radius:6px; border:1px solid #ccc; text-align:left; margin-bottom:2rem;">
        <h3 style="margin-top:0; font-size:1.1rem; border-bottom:1px solid #e2e8f0; padding-bottom:0.5rem; color:var(--petroleum-blue);">Captured URL Search Parameters:</h3>
        <div id="submitted-parameters-dump">No active query parameter traces caught.</div>
      </div>

      <a href="form.html" class="cta-button" style="display:block; text-align:center; padding:0.9rem; border-radius:4px; text-decoration:none;">Submit Another Experience Profile</a>
    </div>
  </main>

</body>
</html>
